# Template: Discover Native Build Tools
# Finds native build tools (CMake, MSBuild, CTest, dumpbin) for the specified architecture.
# Sets pipeline variables that can be used in subsequent steps.
#
# This template solves the ARM64 agent emulation problem by explicitly finding
# and using native ARM64 tools instead of relying on the (broken) agent environment.
#
# It also prints the Azure Pipelines agent version and architecture up front, since
# agent emulation (an x86 agent process running on an ARM64 host) is the root cause
# this template works around.
#
# Output Variables:
#   $(vsPath)       - Visual Studio installation path
#   $(cmakePath)    - Path to cmake.exe
#   $(ctestPath)    - Path to ctest.exe
#   $(msbuildPath)  - Path to MSBuild.exe (architecture-specific)
#   $(dumpbinPath)  - Path to dumpbin.exe (architecture-specific)
#   $(vstestPath)   - Path to vstest.console.exe (architecture-specific)
#   $(appverifPath) - Path to appverif.exe (mandatory; discovery aborts if not found)
#   $(cmakeArch)    - CMake architecture flag (x64, Win32, ARM64)
#   $(targetPlatform) - MSBuild platform (x64, Win32, ARM64)
#   $(cmakeGenerator) - CMake generator string (e.g., "Visual Studio 17 2022")
#
# The logic lives in scripts/discover_native_tools.ps1, loaded from repo_root (the c-build-tools
# checkout of the consumer), so it must run after that checkout. Keeping it out of this template
# keeps the expanded pipeline YAML small, since every job gets its own copy of the template.
#
# Usage:
#   - template: discover_native_tools.yml@c_build_tools
#     parameters:
#       architecture: 'ARM64'
#
#   # Then use in subsequent steps:
#   - script: '"$(cmakePath)" -S . -B build -A $(cmakeArch)'
#   - script: '"$(msbuildPath)" build\solution.sln /p:Platform=$(targetPlatform)'
#   - script: '"$(dumpbinPath)" /ALL mylib.lib'

parameters:
  - name: architecture
    type: string
    default: 'x64'
    values:
      - 'x64'
      - 'x86'
      - 'ARM64'
  - name: repo_root
    default: $(Build.SourcesDirectory)/deps/c-build-tools

steps:
  - task: PowerShell@2
    displayName: 'Discover Native Tools (${{ parameters.architecture }})'
    inputs:
      targetType: 'inline'
      script: |
        $script = '${{ parameters.repo_root }}/pipeline_templates/scripts/discover_native_tools.ps1'
        if (-not (Test-Path $script)) {
            Write-Host "##vso[task.logissue type=error]$script not found. discover_native_tools.yml must run after the checkout that provides c-build-tools at repo_root (${{ parameters.repo_root }})."
            exit 1
        }
        & $script -Architecture '${{ parameters.architecture }}' -ContractVersion 1
        exit $LASTEXITCODE
