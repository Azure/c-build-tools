# This template used to output how much space is used on the drive(s) in case of failure, to
# determine why a pipeline failed with out of disk space.
# The du based reporting is disabled (https://msazure.visualstudio.com/One/_workitems/edit/32920581),
# so the template emits no steps: consumers include it after many steps and every copy counted
# toward the expanded pipeline YAML size limit. The parameters are kept so existing callers still
# compile; restore the step here when the reporting is re-enabled.

parameters:
  - name: depth
    default: 6
  - name: min_size_MB
    default: 1024
  - name: drive_letter
    default: "c"

steps: []
