# Runs an arbitrary executable (ctest or a single test exe) alongside a watchdog process that
# captures full-memory dumps of test processes which approach their per-test timeout.
#
# When a candidate process's age exceeds dump_threshold_sec the watchdog calls awdump
# (preferred, available on gate machines via MonAgentCore install dir) or procdump
# (fallback).
#
# All logic lives in pipeline_templates/scripts/run_with_hang_watchdog.ps1 so it can also be
# run from a developer shell against a locally-built test exe.
#
# Dumps and hang_summary.txt are written to $(Build.ArtifactStagingDirectory)/test_hang_dumps,
# which this template discovers and publishes after a failure or cancellation.
#
# The wrapper preserves the wrapped executable's exit code so failure semantics are unchanged.

parameters:
  - name: display_name
    type: string
  - name: executable
    type: string
  - name: arguments
    type: string
    default: ''
  - name: working_directory
    type: string
  - name: dump_threshold_sec
    type: number
    default: 1200
  - name: poll_interval_sec
    type: number
    default: 30
  - name: dump_tool_timeout_sec
    type: number
    default: 45
  - name: name_pattern
    type: string
    default: '_exe_'
  # When the wrapped executable IS the test exe (single-exe runner) set this true.
  # When the wrapped executable is ctest (and the actual test exes are its children) leave it false.
  - name: include_watched
    type: boolean
    default: false
  # When true, the watchdog kills each candidate process after capturing its dump so the wrapped
  # executable returns before the ADO job timeout. Under ctest, the killed test is reported as
  # failed and ctest can continue with the remaining tests.
  - name: kill_after_dump
    type: boolean
    default: false
  - name: env
    type: object
    default: {}
  - name: repo_root
    default: $(Build.SourcesDirectory)/deps/c-build-tools

steps:
  - task: PowerShell@2
    displayName: ${{ parameters.display_name }}
    inputs:
      targetType: inline
      script: |
        & '${{ parameters.repo_root }}/pipeline_templates/scripts/run_with_hang_watchdog.ps1' `
          -Executable '${{ parameters.executable }}' `
          -Arguments '${{ parameters.arguments }}' `
          -WorkingDirectory '${{ parameters.working_directory }}' `
          -DumpThresholdSec ${{ parameters.dump_threshold_sec }} `
          -PollIntervalSec ${{ parameters.poll_interval_sec }} `
          -DumpToolTimeoutSec ${{ parameters.dump_tool_timeout_sec }} `
          -NamePattern '${{ parameters.name_pattern }}' `
          -IncludeWatched $${{ parameters.include_watched }} `
          -KillAfterDump $${{ parameters.kill_after_dump }} `
          -WatchdogScript '${{ parameters.repo_root }}/pipeline_templates/scripts/test_hang_watchdog.ps1'
        exit $LASTEXITCODE
    env: ${{ parameters.env }}

  - task: PowerShell@2
    displayName: 'Detect hang diagnostics'
    inputs:
      targetType: inline
      script: |
        if ($env:AGENT_JOBSTATUS -notin @('Failed', 'Canceled')) {
          return
        }

        $diagnosticsPath = '$(Build.ArtifactStagingDirectory)\test_hang_dumps'
        $diagnostics = @(Get-ChildItem -Path $diagnosticsPath -File -ErrorAction SilentlyContinue)
        if ($diagnostics.Count -gt 0) {
          Write-Host "Found $($diagnostics.Count) hang diagnostic file(s) under $diagnosticsPath."
          Write-Host '##vso[task.setvariable variable=HangDiagnosticsAvailable]true'
        }
    condition: always()
    continueOnError: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish hang diagnostics'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\test_hang_dumps'
      artifactName: 'test_hang_dumps_$(System.JobName)_$(System.JobAttempt)_$(System.JobId)'
      parallel: true
    condition: and(always(), eq(variables['HangDiagnosticsAvailable'], 'true'))
