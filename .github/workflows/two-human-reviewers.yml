name: Two human reviewers
# Bot-authored pull requests need approvals from two distinct humans.
#
# A human-authored PR already has two people in the loop: the author who wrote and vetted the change,
# and the approver. When the agent opens the PR that first human is missing, so one approval would be
# the only human judgement applied. This job restores the second.
#
# Why a job and not a branch rule: GitHub cannot condition an approval count on the PR author, and a
# required check that never reports blocks a PR forever ("Expected - waiting for status to be
# reported"). So this runs on every PR and passes immediately for human authors, and only bot-authored
# PRs are actually gated.
#
# It deliberately never checks out the PR's code, so running on `pull_request_review` (which carries a
# writable token) cannot execute anything from the branch under review.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  two-human-reviewers:
    name: two-human-reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Count human approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Comma-separated logins whose PRs are gated. Other bots (e.g. dependabot) are intentionally
          # not listed: this is about the agent merging its own unreviewed work, not bots in general.
          BOT_LOGINS: "aiagentpool-mrbot-2[bot]"
          REQUIRED_APPROVALS: "2"
        run: |
          set -euo pipefail

          gated=0
          IFS=',' read -ra logins <<< "$BOT_LOGINS"
          for login in "${logins[@]}"; do
            if [ "$(echo "$login" | xargs)" = "$AUTHOR" ]; then gated=1; fi
          done

          if [ "$gated" -eq 0 ]; then
            echo "PR #$PR was opened by $AUTHOR, so the repository's normal review rules apply."
            exit 0
          fi

          # A reviewer's standing verdict is their most recent APPROVED / CHANGES_REQUESTED review;
          # COMMENTED and PENDING reviews say nothing either way and DISMISSED ones no longer count.
          # Group by reviewer so re-approving the same PR twice can never count as two people.
          approvals=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" | jq -s '
            add // []
            | map(select(.user.type != "Bot"))
            | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED"))
            | group_by(.user.id)
            | map(max_by(.id))
            | map(select(.state == "APPROVED"))
            | length')

          if [ "$approvals" -ge "$REQUIRED_APPROVALS" ]; then
            echo "::notice::$approvals of $REQUIRED_APPROVALS human approvals - this bot-authored PR may merge."
            exit 0
          fi

          echo "::error::This PR was opened by $AUTHOR and needs $REQUIRED_APPROVALS approvals from distinct humans; $approvals so far."
          exit 1
