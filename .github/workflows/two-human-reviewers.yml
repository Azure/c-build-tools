name: Two human reviewers
# Bot-authored PRs need approvals on the head commit from two distinct humans with push access; the
# `mrbot/two-human-reviewers` status reports the verdict. The check is the composite action in
# `.github/actions/two-human-reviewers`; this workflow fetches it from a trusted ref and runs it. Fork PRs get a
# read-only token, so they need a manual run (`pull_request_target` is blocked by default). Never check out PR code,
# and require code owner review on `.github/workflows/**`.
#
# A repository with a `deps/c-build-tools` submodule should install
# `.github/workflow-templates/two-human-reviewers.caller.yml` instead, which takes the gate from that submodule, so
# dependency updates never need to edit a workflow. Calling this workflow runs the gate from the commit in the
# caller's `uses:` line.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to evaluate. Only needed when running from `workflow_dispatch`.
        type: string
        required: false
        default: ''
      required-approvals:
        description: How many distinct humans must approve a bot-authored PR. Defaults to 2.
        type: number
        required: false
      exempt-bots:
        description: >-
          Comma-separated GitHub account names of bots that may merge under the repository's normal
          rules. Defaults to "dependabot[bot]"; passing this replaces that default rather than adding
          to it.
        type: string
        required: false
  # A manual run uses the default branch's copy with a token that can write, and publishes the status to
  # the PR's head commit. Start it with "Run workflow" or the command below; re-running a fork PR's own
  # run keeps its read-only token. Repeat it after each push or review.
  #   gh workflow run two-human-reviewers.yml -R <owner>/<repo> -f pr=<number>
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate.
        type: string
        required: true
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  two-human-reviewers:
    name: two-human-reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          GATE_REPO: ${{ job.workflow_repository }}
          CALLED_AT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          if [ -z "$PR" ]; then
            echo "::error::No pull request to evaluate; pass the PR number when dispatching manually."
            exit 1
          fi

          if [ "$REPO" = "$GATE_REPO" ]; then
            # This repository's own pull requests run the pull request's copy of this file, so the gate comes
            # from the target branch instead: a pull request must not pick the gate that judges it.
            gate_ref=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
          else
            gate_ref=$CALLED_AT
          fi

          mkdir -p .gate
          if ! gh api -X GET "repos/$GATE_REPO/contents/.github/actions/two-human-reviewers/action.yml" \
              -f ref="$gate_ref" -H "Accept: application/vnd.github.raw+json" > .gate/action.yml; then
            echo "::error::$GATE_REPO@$gate_ref has no .github/actions/two-human-reviewers/action.yml."
            exit 1
          fi
          echo "::notice::Gate from $GATE_REPO@$gate_ref."

      - uses: ./.gate
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          # An omitted number input reads as 0, which must reach the action as empty so its default applies.
          required-approvals: ${{ inputs.required-approvals || '' }}
          exempt-bots: ${{ inputs.exempt-bots }}
