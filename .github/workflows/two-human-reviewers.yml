name: Two human reviewers
# Bot-authored PRs need approvals on the head commit from two distinct humans with push access; the
# `mrbot/two-human-reviewers` status reports the verdict. The composite action is fetched from a trusted
# ref: the target branch for this repository's PRs, or the pinned workflow commit for external callers.
# Repositories with deps/c-build-tools should install the caller in .github/workflow-templates instead.
# Fork PRs get a read-only token, so they need a manual run (`pull_request_target` is blocked by default).
# Never check out PR code, and require code owner review on `.github/workflows/**`.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to evaluate. Only needed when running from `workflow_dispatch`.
        type: string
        required: false
        default: ''
      required-approvals:
        description: How many distinct humans must approve a bot-authored PR. Defaults to 2.
        type: number
        required: false
      exempt-bots:
        description: >-
          Comma-separated GitHub account names of bots that may merge under the repository's normal
          rules. Defaults to "dependabot[bot]"; passing this replaces that default rather than adding
          to it.
        type: string
        required: false
  # A manual run uses the default branch's copy with a token that can write, and publishes the status to
  # the PR's head commit. Start it with "Run workflow" or the command below; re-running a fork PR's own
  # run keeps its read-only token. Repeat it after each push or review.
  #   gh workflow run two-human-reviewers.yml -R <owner>/<repo> -f pr=<number>
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate.
        type: string
        required: true
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  two-human-reviewers:
    name: two-human-reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          GATE_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pass a positive PR number when dispatching manually."
            exit 1
          fi
          if ! [[ "$GATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::The workflow repository is unavailable or invalid."
            exit 1
          fi

          if [ "$REPO" = "$GATE_REPO" ]; then
            # c-build-tools has no submodule pointing to itself; use its target branch's action.
            base_ref=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
            gate_ref="refs/heads/$base_ref"
          else
            # External callers retain the version selected by their pinned reusable-workflow uses.
            if ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The pinned workflow commit is unavailable or invalid."
              exit 1
            fi
            gate_ref=$WORKFLOW_SHA
          fi

          mkdir -p .gate
          if ! gh api -X GET "repos/$GATE_REPO/contents/.github/actions/two-human-reviewers/action.yml" \
              -f ref="$gate_ref" -H "Accept: application/vnd.github.raw+json" > .gate/action.yml; then
            echo "::error::Could not fetch the gate from $GATE_REPO@$gate_ref."
            exit 1
          fi
          echo "::notice::Gate from $GATE_REPO@$gate_ref."

      - uses: ./.gate
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          required-approvals: ${{ inputs.required-approvals || 2 }}
          exempt-bots: ${{ inputs.exempt-bots }}
