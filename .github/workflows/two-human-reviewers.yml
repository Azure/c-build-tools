name: Two human reviewers
# Bot-authored pull requests need approvals from two distinct humans (see `required-approvals`).
#
# A human-authored PR already has two people in the loop: the author who wrote and vetted the change,
# and the approver. When the agent opens the PR that first human is missing, so a single approval would
# be the only human judgement applied to it. This restores the second.
#
# This is the shared definition. Other repositories call it from a thin caller workflow, so the logic
# is maintained once; it also triggers directly on this repository's own PRs, which is why it declares
# `pull_request` alongside `workflow_call`. When called, `github.repository` and the event payload are
# the caller's, so it gates the calling repository's PR.
#
# A called workflow's own triggers are ignored - only the caller's events run it - so a caller MUST
# declare `pull_request_review` as well as `pull_request`. Without it the gate evaluates once at open,
# finds no approvals, and never re-runs when humans approve, leaving the required check stuck failing.
# `.github/workflow-templates/two-human-reviewers.caller.yml` is the template to copy.
#
# What this does and does not defend against: for `pull_request` events GitHub runs the definition from
# the pull request's own head, so a pull request may edit this file and be judged by its edited copy.
# Deleting it fails safe - the required check never reports and the pull request cannot merge - but
# weakening it does not, so treat a diff that touches this file as security-relevant and review it as
# such. Consuming repositories are not exposed that way: they call this definition at a fixed ref, so a
# pull request in the calling repository cannot alter the logic, only its own caller stub. Requiring code
# owner review on `.github/workflows/**` is what actually closes this, and belongs in branch protection
# rather than here.
#
# Why a job and not a branch rule: GitHub cannot condition an approval count on the PR author, and a
# required check that never reports blocks a PR forever ("Expected - waiting for status to be
# reported"). So this runs on every PR and passes immediately for human authors, and only bot-authored
# PRs are actually gated.
#
# The unit being judged is the head commit, not the pull request that triggered the run. A check run
# attaches to a commit, and branch protection reads the newest run of a given name on the pull request's
# head commit - so two pull requests that share a head commit share this check, and whichever run
# finishes last decides both. Copying a bot's branch and opening a second pull request from it is enough
# to produce that, and judging only the triggering pull request would then let the copy's "author is
# human, not gated" verdict land on the bot's pull request and clear it. Every open pull request on the
# commit is therefore evaluated together, which makes the verdict a function of the commit alone and
# leaves the order the runs finish in unable to change it. The cost is that a human's pull request
# sharing a commit with a bot's is held to the bot's requirement; that is the safe direction, and the
# approvals it collects count toward the shared commit.
#
# Gating on "the author is a bot" rather than on a list of named bots is deliberate: an app can be
# renamed, and a stale name would silently let its pull requests through under-reviewed. Exempting a bot
# is therefore an explicit act, and forgetting to update this file can only ever be too strict.
#
# `dependabot[bot]` is exempt. The gate exists because an agent writes the change a human would
# otherwise have written and vetted, leaving one human short. A dependency bump has no missing author:
# the change is a version number, and the code it pulls in was never going to be written here. The
# repository's normal review rule is the control that fits it.
#
# It deliberately never checks out the PR's code, so running on `pull_request_review` (which carries a
# writable token) cannot execute anything from the branch under review.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to evaluate. Only needed when running from `workflow_dispatch`.
        type: string
        required: false
        default: ''
      required-approvals:
        description: How many distinct humans must approve a bot-authored PR. Defaults to 2.
        type: number
        required: false
      exempt-bots:
        description: >-
          Comma-separated GitHub account names of bots that may merge under the repository's normal
          rules. Defaults to "dependabot[bot]"; passing this replaces that default rather than adding
          to it.
        type: string
        required: false
  # Dispatching runs against the default branch, so the check run it produces attaches to that branch's
  # commit rather than to a pull request's head, and no pull request is unblocked by it. It reports the
  # verdict to the run log, which makes it useful for checking this logic against a real pull request. A
  # pull request that was already open when the gate landed has no event to evaluate it with - those don't
  # fire retroactively - and is unstuck by reopening it, or by any push to it.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate.
        type: string
        required: true
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  two-human-reviewers:
    name: two-human-reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Count human approvals
        env:
          # github.token rather than secrets.GITHUB_TOKEN so this works without the caller passing
          # `secrets: inherit`.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # `inputs` is empty when this runs on its own repository's PRs rather than being called, so
          # these fallbacks - not a `default:` on the input - are what actually set the values. Declaring
          # both would put the same literal in two places, and a `default:` reached only on the called
          # path is how the two would come to disagree.
          EXEMPT_BOTS: ${{ inputs.exempt-bots || 'dependabot[bot]' }}
          REQUIRED_APPROVALS: ${{ inputs.required-approvals || 2 }}
          STATUS_CONTEXT: mrbot/two-human-reviewers
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$PR" ]; then
            echo "::error::No pull request to evaluate; pass the PR number when dispatching manually."
            exit 1
          fi

          # Read the PR from the API rather than the event payload, so a manual dispatch - which carries
          # no pull_request payload - evaluates exactly what an event-triggered run would.
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          head_sha=$(jq -r '.head.sha' <<< "$pr_json")

          # The verdict is published as a commit status because a status can sit in `pending` and a job
          # cannot: a job either passes or fails, so an unmet gate could only ever render as a failure -
          # which reads as "the automation is broken" rather than "waiting for a second human". Branch
          # protection treats a pending required status as blocking, which is exactly the intent.
          #
          # Publishing is best effort. It needs `statuses: write`, which a called workflow only has if its
          # caller granted it, and a `pull_request` run on a fork's pull request holds a read-only token
          # whatever the caller granted. Neither case may fail the run: the job's own exit code is what
          # those repositories still gate on, and turning a missing permission into a red check would
          # block them on the automation rather than on the review.
          publish() {
            if ! gh api --method POST "repos/$REPO/statuses/$head_sha" \
                   -f state="$1" -f context="$STATUS_CONTEXT" -f description="$2" \
                   -f target_url="$RUN_URL" >/dev/null 2>&1; then
              echo "::warning::Could not publish the $STATUS_CONTEXT status. The run needs 'statuses: write', and a fork's pull request cannot be published to from a pull_request trigger."
            fi
          }

          # Every open pull request whose head is this commit, because they all share this check and
          # so must all get the same answer. The triggering pull request is folded in explicitly rather
          # than trusted to appear, so lag in the commit-to-pull-request index cannot drop the one pull
          # request known to be on this commit. Pull requests that merely contain the commit further back
          # in their history are excluded - their own head commit carries their own check.
          shared=$(
            {
              gh api --paginate "repos/$REPO/commits/$head_sha/pulls" --jq '.[]'
              printf '\n%s' "$pr_json"
            } | jq -s --arg head "$head_sha" '
                map(select(.state == "open" and .head.sha == $head))
                | unique_by(.number)'
          )

          # Nothing open on the commit means nothing can merge on it; judging the triggering pull request
          # alone still reports a result rather than erroring on an empty set.
          if [ "$(jq 'length' <<< "$shared")" -eq 0 ]; then
            shared=$(jq -s '.' <<< "$pr_json")
          fi

          exempt=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$EXEMPT_BOTS")
          gated=$(jq -c --argjson exempt "$exempt" '
            map(select(.user.type == "Bot"))
            | map(select(.user.login as $login | $exempt | index($login) | not))' <<< "$shared")

          shared_desc=$(jq -r 'map("#\(.number) by \(.user.login)") | join(", ")' <<< "$shared")

          if [ "$(jq 'length' <<< "$gated")" -eq 0 ]; then
            publish success "No bot-authored pull request on this commit"
            echo "No bot-authored pull request is open on commit ${head_sha:0:7} ($shared_desc), so the repository's normal review rules apply."
            exit 0
          fi

          gated_desc=$(jq -r 'map("#\(.number) by \(.user.login)") | join(", ")' <<< "$gated")

          # Reduce each reviewer to their most recent verdict *before* judging it, so a dismissal that
          # arrives as its own record supersedes the approval it dismissed instead of being filtered out
          # and leaving that approval standing. COMMENTED and PENDING reviews say nothing either way.
          # Grouping by reviewer also means re-approving can never count as two people, and that a
          # reviewer who approved one pull request on this commit and then rejected another counts once,
          # as their latest verdict.
          #
          # Only approvals from reviewers who can push count. These repositories are public, so anyone
          # with a GitHub account can submit an approving review, and counting those would let two
          # throwaway accounts satisfy the gate. Push access is the test rather than the reviewer's
          # association with the repository, because association does not imply write: an organisation
          # member or a collaborator can be read-only, while an outside collaborator granted write is
          # legitimately a reviewer. This mirrors how GitHub counts its own required approvals.
          #
          # An approval counts only for the commit it was given on: the bot pushes to its own PR, so an
          # approval of an earlier commit must not carry over to code no human has looked at. Reviews are
          # pooled across the pull requests sharing the commit because the question being answered is
          # whether two humans have signed off on this code, not on a particular pull request.
          reviews=$(mktemp)
          for number in $(jq -r '.[].number' <<< "$shared"); do
            gh api graphql --paginate \
              -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$number" \
              -f query='
                query($owner: String!, $repo: String!, $pr: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviews(first: 100, after: $endCursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          databaseId
                          state
                          authorCanPushToRepository
                          author { login __typename }
                          commit { oid }
                        }
                      }
                    }
                  }
                }' \
              --jq '.data.repository.pullRequest.reviews.nodes[]' >> "$reviews"
          done

          approvers=$(jq -s --arg head "$head_sha" '
            map(select(.author.__typename != "Bot"))
            | map(select(.authorCanPushToRepository == true))
            | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.author.login)
            | map(max_by(.databaseId))
            | map(select(.state == "APPROVED" and .commit.oid == $head))
            | map(.author.login)
            | unique' "$reviews")
          approvals=$(jq 'length' <<< "$approvers")
          approver_list=$(jq -r 'join(", ")' <<< "$approvers")

          if [ "$approvals" -ge "$REQUIRED_APPROVALS" ]; then
            publish success "$approvals of $REQUIRED_APPROVALS human approvals on this commit"
            echo "::notice::Commit ${head_sha:0:7} has $approvals of $REQUIRED_APPROVALS human approvals ($approver_list); bot-authored $gated_desc may merge."
            exit 0
          fi

          publish pending "Needs $REQUIRED_APPROVALS approvals from distinct humans on this commit; $approvals so far"
          echo "::error::Commit ${head_sha:0:7} carries bot-authored $gated_desc and needs $REQUIRED_APPROVALS approvals from distinct humans on this commit; $approvals so far${approver_list:+ ($approver_list)}."
          exit 1
