name: Test two human reviewers

on:
  pull_request:
    paths:
      - .github/actions/two-human-reviewers/**
      - .github/tests/test_two_human_reviewers.py
      - .github/tests/requirements.txt
      - .github/workflows/test-two-human-reviewers.yml
  push:
    branches: [master]
    paths:
      - .github/actions/two-human-reviewers/**
      - .github/tests/test_two_human_reviewers.py
      - .github/tests/requirements.txt
      - .github/workflows/test-two-human-reviewers.yml

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run action fixtures without GitHub access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cmake/two-human-reviewers-tests
          python3 -m venv cmake/two-human-reviewers-venv
          cmake/two-human-reviewers-venv/bin/python -m pip install \
            --disable-pip-version-check -r .github/tests/requirements.txt
          command -v bash
          jq --version
          if ! cmake/two-human-reviewers-venv/bin/python .github/tests/test_two_human_reviewers.py \
              > cmake/two-human-reviewers-tests/results.log 2>&1; then
            cat cmake/two-human-reviewers-tests/results.log
            exit 1
          fi
          cat cmake/two-human-reviewers-tests/results.log
