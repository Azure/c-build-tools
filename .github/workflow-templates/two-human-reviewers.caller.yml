name: Two human reviewers
# BEGIN template-only - Deploy-GitHubReviewPolicy.ps1 strips this block when installing the workflow.
#
# Copy this into a consuming repository as .github/workflows/two-human-reviewers.yml after its target
# branch's deps/c-build-tools contains the snapshot-contract action. Without that submodule, call the
# reusable workflow at a reviewed full commit SHA instead. See docs/two_human_reviewers.md.
#
# This template is outside .github/workflows because c-build-tools uses its own reusable workflow.
# END template-only
# Read the gate from the target branch, never from PR code. Do not add a checkout.
# A fork's event token is read-only; a maintainer can publish its status with:
# gh workflow run two-human-reviewers.yml -R <owner>/<repo> -f pr=<number>

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate.
        type: string
        required: true
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  two-human-reviewers:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      STATUS_CONTEXT: mrbot/two-human-reviewers
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      READ_ONLY: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    steps:
      - name: Capture the PR and reset its status
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A positive PR number is required."
            exit 1
          fi
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          if ! head_sha=$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_json"); then
            echo "::error::The PR API returned an invalid head SHA."
            exit 1
          fi
          if ! target=$(jq -er '.base.ref | select(type == "string" and length > 0)' <<< "$pr_json") ||
              ! git check-ref-format "refs/heads/$target"; then
            echo "::error::The PR API returned an invalid target branch."
            exit 1
          fi
          printf 'pr=%s\nhead=%s\ntarget=%s\n' "$PR" "$head_sha" "$target" >> "$GITHUB_OUTPUT"

          if ! gh api --method POST "repos/$REPO/statuses/$head_sha" \
              -f state=pending -f context="$STATUS_CONTEXT" \
              -f description="Loading and evaluating the reviewer gate" -f target_url="$RUN_URL" >/dev/null; then
            if [ "$READ_ONLY" = "true" ]; then
              echo "::warning::Read-only event token: the status was not reset. A maintainer must use Run workflow with pr=$PR after each push or review."
            else
              echo "::error::Could not reset the required status; an earlier status may still exist."
              exit 1
            fi
          fi

      - name: Fetch the trusted gate
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.capture.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          encoded_target=$(jq -rn --arg ref "$TARGET" '$ref | @uri')
          branch=$(gh api "repos/$REPO/git/ref/heads/$encoded_target")
          if ! base_sha=$(jq -er --arg ref "refs/heads/$TARGET" \
              'select(.ref == $ref and .object.type == "commit") | .object.sha |
               select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$branch"); then
            echo "::error::Could not resolve the target branch to a commit."
            exit 1
          fi
          gitlink=$(gh api -X GET "repos/$REPO/contents/deps/c-build-tools" -f ref="$base_sha")
          if ! gate_sha=$(jq -er 'select(.type == "submodule") | .sha |
              select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$gitlink"); then
            echo "::error::deps/c-build-tools on $TARGET is not a valid gitlink."
            exit 1
          fi

          upstream=$(gh api "repos/Azure/c-build-tools/git/ref/heads/master")
          if ! master_sha=$(jq -er 'select(.ref == "refs/heads/master" and .object.type == "commit") |
              .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$upstream"); then
            echo "::error::Could not resolve Azure/c-build-tools master to a commit."
            exit 1
          fi
          comparison=$(gh api "repos/Azure/c-build-tools/compare/$gate_sha...$master_sha")
          ancestry=$(jq -r '.status' <<< "$comparison")
          if [ "$ancestry" != "ahead" ] && [ "$ancestry" != "identical" ]; then
            echo "::error::deps/c-build-tools on $TARGET pins $gate_sha, which is not on Azure/c-build-tools master."
            exit 1
          fi

          mkdir -p .gate
          if ! gh api -X GET "repos/Azure/c-build-tools/contents/.github/actions/two-human-reviewers/action.yml" \
              -f ref="$gate_sha" -H "Accept: application/vnd.github.raw+json" > .gate/action.yml; then
            echo "::error::Could not download the gate from Azure/c-build-tools@$gate_sha."
            exit 1
          fi
          if ! grep -Fxq '# two-human-reviewers-snapshot-contract: 1' .gate/action.yml; then
            echo "::error::The trusted gate does not support snapshot contract 1. Land or propagate the prerequisite action first."
            exit 1
          fi
          echo "::notice::Gate from Azure/c-build-tools@$gate_sha, pinned by $TARGET at $base_sha."

      - name: Evaluate human approvals
        id: evaluate
        uses: ./.gate
        with:
          pr: ${{ steps.capture.outputs.pr }}
          expected-head: ${{ steps.capture.outputs.head }}
          expected-target: ${{ steps.capture.outputs.target }}

      - name: Report gate failure
        if: ${{ failure() && steps.capture.outputs.head != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.capture.outputs.head }}
          TARGET: ${{ steps.capture.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          if ! current_pr=$(gh api "repos/$REPO/pulls/$PR"); then
            echo "::error::Could not recheck the PR before reporting failure; its status was not changed."
            exit 1
          fi
          if ! jq -e --arg head "$HEAD" --arg target "$TARGET" \
              '.head.sha == $head and .base.ref == $target' <<< "$current_pr" >/dev/null; then
            echo "::notice::The PR changed during evaluation; no obsolete failure status was published."
            exit 0
          fi
          if ! gh api --method POST "repos/$REPO/statuses/$HEAD" \
              -f state=error -f context="$STATUS_CONTEXT" \
              -f description="Reviewer gate could not be loaded or evaluated; see the workflow run" \
              -f target_url="$RUN_URL" >/dev/null; then
            if [ "$READ_ONLY" = "true" ]; then
              echo "::warning::Read-only event token: failure status was not published. A maintainer must use Run workflow with pr=$PR."
            else
              echo "::error::Could not publish the gate failure; check the required status before merging."
              exit 1
            fi
          fi
